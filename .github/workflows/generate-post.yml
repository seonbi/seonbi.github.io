name: Generate Blog Post with Gemini

on:
  schedule:
    - cron: '0 0 * * 1' # 매주 월요일 자정에 실행 (UTC 기준)
  workflow_dispatch: # 수동으로 실행할 수 있는 버튼 활성화

permissions:
  contents: write # 레포지토리에 푸시할 권한 필요
  actions: write # 다른 워크플로우(배포)를 실행할 권한 필요

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install @google/generative-ai

      - name: Run Gemini Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-post.js

      - name: Commit and Push Changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/content/posts/*.md
          # 변경사항이 있을 때만 커밋 및 푸시
          if ! git diff-index --quiet HEAD; then
            git commit -m "docs: auto-generate blog post via Gemini API"
            git push
            
            # 푸시 완료 후 강제로 배포 워크플로우(deploy.yml) 실행
            echo "Triggering deploy workflow..."
            gh workflow run deploy.yml --ref main
          else
            echo "No changes to commit"
          fi
